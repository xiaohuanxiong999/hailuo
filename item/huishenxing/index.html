  :root{
    --blue:#00a5d8;
    --ink:#24292f;
    --ink-2:#57606a;
    --ink-3:#8b949e;
    --line:#e8eaed;
    --bg:#f6f8fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.85;
    -webkit-user-select:text;user-select:text;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 24px}

  /* 顶栏 */
  .top{
    display:flex;align-items:center;gap:10px;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .top img{width:30px;height:30px;display:block}
  .top .name{
    font-family:'HuangYou','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:20px;color:var(--blue);letter-spacing:.08em;
  }
  .top .tag{font-size:12px;color:var(--ink-3);margin-left:auto}

  /* 标题区 */
  .titleZone{padding:26px 0 6px;border-bottom:3px double var(--line)}
  h1{margin:0;font-size:28px;font-weight:600;line-height:1.3}
  .subtitle{margin-top:4px;font-size:13px;color:var(--ink-3)}
  .subtitle a{color:var(--blue);text-decoration:none}

  /* 主体两栏 */
  .main{display:flex;gap:34px;padding:22px 0 60px}
  .content{flex:1;min-width:0}
  .side{flex:none;width:264px}

  .content p{margin:1.1em 0;color:var(--ink)}
  .content p b{color:var(--ink)}
  .ref{
    font-size:11px;color:var(--blue);vertical-align:super;
    margin:0 1px;text-decoration:none;
  }

  /* 右侧卡片 */
  .card{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;margin-bottom:18px;
  }
  .card img{width:100%;display:block}
  .card .cap{
    padding:8px 12px;font-size:12.5px;color:var(--ink-2);
    border-top:1px solid var(--line);
  }
  .infoTable{width:100%;border-collapse:collapse;font-size:13.5px}
  .infoTable th,.infoTable td{
    text-align:left;padding:7px 12px;border-top:1px solid var(--line);
    vertical-align:top;
  }
  .infoTable th{
    width:76px;font-weight:400;color:var(--ink-3);white-space:nowrap;
  }
  .infoTable td{color:var(--ink)}

  /* 底部 */
  .catline{
    border-top:1px solid var(--line);margin-top:10px;padding:14px 0 30px;
    font-size:12.5px;color:var(--ink-3);
  }
  .catline a{color:var(--blue);text-decoration:none;margin-right:8px}

  .toast{
    position:fixed;left:50%;bottom:40px;transform:translate(-50%,10px);
    background:#333;color:#eee;font-size:13px;padding:9px 16px;border-radius:6px;
    opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:700px){
    .main{flex-direction:column}
    .side{width:100%}
    h1{font-size:23px}
  }
</style>

  t.textContent=msg; t.classList.add('on');
  setTimeout(function(){t.classList.remove('on')},1600);
}
</script>
