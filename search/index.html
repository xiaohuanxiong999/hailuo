  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.62;
    -webkit-user-select:text;user-select:text;   /* 全局可复制 */
  }
  .wrap{position:relative;z-index:1}
  a{cursor:pointer}
  .wrap{max-width:690px;margin:0 auto;padding:0 18px 70px}

  /* ---------- 顶栏 logo ---------- */
  .top{display:flex;align-items:center;gap:14px;padding:34px 0 0}
  .top img{width:52px;height:52px;display:block}
  .top .name{
    font-family:'HuangYou','PingFang SC','Microsoft YaHei',sans-serif;
    font-size:38px;font-weight:400;color:var(--blue);
    letter-spacing:.1em;line-height:1;
    transform:translateY(2px);
    text-shadow:0 1px 0 rgba(0,120,170,.12);
  }

  /* ---------- 搜索框 ---------- */
  .szone{position:relative;margin-top:22px;z-index:30}
  .sbox{
    display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:26px;
    height:52px;padding:0 8px 0 20px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -18px rgba(0,0,0,.18);
    transition:border-color .2s,box-shadow .2s;
  }
  .sbox:focus-within{border-color:#bcd8e4;box-shadow:0 1px 3px rgba(0,0,0,.05),0 10px 28px -16px rgba(0,30,50,.25)}
  .szone.open .sbox{border-radius:26px 26px 0 0}
  .sbox input{
    flex:1;border:0;outline:0;background:transparent;
    font-size:16px;color:var(--ink);font-family:inherit;min-width:0;
  }
  .sbox input::placeholder{color:#a8a8a8}
  .sbox .btn{
    flex:none;height:38px;padding:0 26px;border:0;border-radius:20px;
    background:var(--blue);color:#fff;font-size:15px;cursor:pointer;
    font-family:inherit;transition:background .15s,transform .12s;
  }
  .sbox .btn:hover{background:var(--blue-deep)}
  .sbox .btn:active{transform:scale(.96)}

  /* ---------- 历史下拉 ---------- */
  .drop{
    display:none;position:absolute;left:0;right:0;top:47px;
    background:#fff;border:2px solid var(--blue);border-top:1px solid #eee;
    border-radius:0 0 18px 18px;
    padding:4px 0 8px;box-shadow:0 14px 28px -16px rgba(0,0,0,.28);
  }
  .szone.open .drop{display:block}
  .drop .it{
    display:flex;align-items:center;gap:10px;
    padding:7px 16px;font-size:14.5px;color:var(--ink-2);cursor:pointer;
  }
  .drop .it:hover{background:#f2f9fc;color:var(--ink)}
  .drop .it svg{width:14px;height:14px;flex:none;stroke:#b9bdc4;fill:none}
  .drop .clear{
    margin:6px 16px 0;padding-top:6px;border-top:1px solid #f0f0f0;
    font-size:12px;color:#b0b0b0;cursor:pointer;display:inline-block;
  }
  .drop .clear:hover{color:var(--blue)}

  /* ---------- 结果 ---------- */
  .meta{margin:18px 2px 0;font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between}
  .results{margin-top:4px}
  .res{padding:18px 0 17px;border-bottom:1px solid #f0eeea}
  .res:last-child{border-bottom:0}
  .res .src{display:flex;align-items:center;gap:7px;margin-bottom:5px;font-size:12.5px;color:var(--ink-3)}
  .res .ico{
    width:16px;height:16px;border-radius:3px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;color:#fff;font-weight:600;
  }
  .res .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .url .d{color:#5b636d}
  .res h3{margin:0 0 4px;font-size:17.5px;font-weight:600;line-height:1.4}
  .want{min-height:120px;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:600;letter-spacing:10px;color:#050505;opacity:0;
    text-shadow:0 1px 0 rgba(255,255,255,.4)}
  .want.on{animation:wfadein .5s ease forwards}
  @keyframes wfadein{from{opacity:0}to{opacity:1}}
  @keyframes wbreath{0%,100%{opacity:.92}50%{opacity:.55}}
  .adtag{display:inline-block;vertical-align:2px;margin-left:8px;padding:0 5px;border:1px solid #d8dee6;border-radius:2px;color:#9aa4b0;font-size:10.5px;font-weight:400;letter-spacing:1px}
  .res h3 a{color:var(--link);text-decoration:none}
  .res h3 a:hover{text-decoration:underline}
  .res .desc{font-size:14px;color:var(--ink-2);line-height:1.68;display:flex;align-items:baseline;gap:5px}
  .res .desc .date{flex:none}
  .res .desc .dt{
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .res .date{color:var(--ink-3);margin-right:4px}
  mark{background:transparent;color:#c22;font-weight:700}
  .ad{font-size:11px;border:1px solid #dfe3e8;color:#9aa1ab;border-radius:3px;padding:0 4px;margin-right:2px}
  .res.clickable{
    position:relative;cursor:pointer;border-radius:8px;
    margin:0 -14px;padding:18px 14px 17px;transition:background .18s;
  }
  .res.clickable:hover{background:#f2f8fa}
  .res.clickable::before{
    content:"";position:absolute;left:0;top:21px;bottom:20px;width:2px;
    background:var(--blue);border-radius:2px;opacity:.55;
  }
  .res{animation:fadein .34s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .noMore{text-align:center;color:#b3b7bc;font-size:12.5px;padding:22px 0 10px;letter-spacing:.05em}

  /* ---------- 空状态 ---------- */
  .empty{padding:60px 0 40px;text-align:center}
  .empty .big{font-size:15px;color:#9aa0a6;margin-bottom:8px;font-weight:400}
  .empty .small{font-size:13px;color:#b0b5ba}


  .toast{
    position:fixed;left:50%;bottom:60px;transform:translate(-50%,10px);
    background:#333;color:#eee;font-size:13px;padding:9px 16px;border-radius:6px;
    opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:600px){
    .top{padding-top:20px;gap:10px}
    .top img{width:40px;height:40px}
    .top .name{font-size:28px}
    .sbox{height:44px}
    .res h3{font-size:16.5px}
  }
</style>
</head>

/* ---------- 工具 ---------- */
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function norm(s){
  return String(s).toLowerCase().replace(/\s+/g,'')
    .replace(/[的了吗呢啊是在有和与及、，,。？?！!《》"'"'']/g,'');
}
function resolve(query){
  var q = String(query||'').trim();
  if(!q) return null;
  if(q==='蛇') return '蛇';                    // 单字特批
  var nq = norm(q);
  if(nq.length < 2) return null;              // 单个字符不命中
  // 1) 完全命中
  if(SOURCE[q]) return q;
  for(var k in SOURCE){ if(norm(k)===nq) return k; }
  if(ALIAS[q.toLowerCase()]) return ALIAS[q.toLowerCase()];
  for(var a in ALIAS){ if(norm(a)===nq) return ALIAS[a]; }
  // 2) 输入包含完整关键词（长句里带了关键词）
  for(var k2 in SOURCE){
    var nk = norm(k2);
    if(nk.length>=2 && nq.indexOf(nk)>=0) return k2;
  }
  // 3) 输入是某关键词的片段（>=2字），如"毁神""神星" → 毁神星
  for(var k3 in SOURCE){
    var nk3 = norm(k3);
    if(nk3.length>=2 && naLen(nq)>=2 && nk3.indexOf(nq)>=0){
      if(k3.indexOf('这个世界')>=0) return null;   // 该帖必须完整标题
      return k3;
    }
  }
  return null;
}
function naLen(s){ return s.replace(/[^\u4e00-\u9fa5a-z0-9]/g,'').length; }
var CUR_QUERY='';
var LIST_ALLOW_HAIOU_KEYS=['这个世界怎么了？','猝死'];
function hl(text, kw){
  if(!kw) return esc(text);
  var t = esc(text), tl = t.toLowerCase();
  var q = CUR_QUERY ? esc(CUR_QUERY) : esc(kw);
  if(q.length < 2) return t;
  // 贪心找查询词里出现在文本中的片段（>=2字符），从长到短、标记后跳过已标区
  var marks = [], used = new Array(t.length).fill(false);
  for(var L = q.length; L >= 2; L--){
    for(var i = 0; i + L <= q.length; i++){
      var seg = q.slice(i, i + L).toLowerCase();
      var pos = 0;
      while((pos = tl.indexOf(seg, pos)) >= 0){
        var ok = true;
        for(var j = pos; j < pos + seg.length; j++){ if(used[j]){ ok=false; break; } }
        if(ok){ marks.push([pos, pos+seg.length]); for(var j2=pos; j2<pos+seg.length; j2++) used[j2]=true; }
        pos += seg.length;
      }
    }
  }
  if(!marks.length) return t;
  marks.sort(function(a,b){return a[0]-b[0]});
  var out='', last=0;
  marks.forEach(function(m){
    out += t.slice(last, m[0]) + '<mark>' + t.slice(m[0], m[1]) + '</mark>';
    last = m[1];
  });
  return out + t.slice(last);
}

/* 显示URL = 真实域名 › 真实路径（与实际页面地址完全一致） */
function showURL(r){
  var host = location.hostname || 'hailuo.app.workbuddy.host';
  var segs = r.path.split('/').filter(function(x){return x});
  if(r.sec) return host + ' › ' + r.siteKey + ' › ' + r.sec + ' › ' + (r.secName || segs[segs.length-1] || '');
  var section = segs.length>1 ? segs[1] : (segs[0]||'');
  var parts = [host];
  if(r.siteKey) parts.push(r.siteKey);
  if(section) parts.push(section);
  return parts.join(' › ');
}

/* ---------- 历史（localStorage） ---------- */
var HKEY='hailuo_history';
var HIST_MEM=null;   // localStorage 被沙箱禁用时的内存兜底
function lsGet(){
  try{ return localStorage.getItem(HKEY); }catch(e){ return HIST_MEM; }
}
function lsSet(v){
  try{ localStorage.setItem(HKEY,v); }catch(e){}
  HIST_MEM=v;
}
function lsDel(){
  try{ localStorage.removeItem(HKEY); }catch(e){}
  HIST_MEM=null;
}
function getHist(){ try{ return JSON.parse(lsGet()||'[]'); }catch(e){ return []; } }
function addHist(q){
  var h=getHist().filter(function(x){return x!==q});
  h.unshift(q); if(h.length>12) h.length=12;
  lsSet(JSON.stringify(h));
}
function clearHist(e){
  if(e) e.stopPropagation();
  lsDel();
  renderDrop();
}
function renderDrop(){
  var h=getHist(), d=el('drop');
  if(!h.length){ d.innerHTML=''; el('szone').classList.remove('open'); return; }
  var html='';
  h.forEach(function(q){
    html += '<div class="it" onclick="pick(this.textContent.trim())">'+
      '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'+
      esc(q)+'</div>';
  });
  html += '<span class="clear" onclick="clearHist(event)">清空搜索历史</span>';
  d.innerHTML = html;
}

/* ---------- 渲染结果 ---------- */
function render(query){
  var out = el('out');
  if(!query){
    document.title='海螺';
    out.innerHTML='';
    return;
  }
  var key = resolve(query);
  CUR_QUERY = query;
  document.title = query + ' - 海螺';

  if(!key){
    out.innerHTML =
      '<div class="empty"><div class="big">暂无搜索结果</div>'+
      '<div class="small">没有找到与「'+esc(query)+'」相关的内容</div></div>';
    return;
  }

  var list = SOURCE[key];
  // 规则：紫薇那篇报道看过的玩家永远找不到了（定时消失，永久移除）
  if(list && localStorage.getItem('hl_ziwei_gone')==='1'){
    list = list.filter(function(it){ return it.href!=='/news/ziwei-infuse'; });
    if(!list.length){ list=null; }
  }
  if(!list){
    out.innerHTML =
      '<div class="empty"><div class="big">暂无搜索结果</div>'+
      '<div class="small">没有找到与「'+esc(query)+'」相关的内容</div></div>';
    return;
  }
  // 规则：infuse 在玩家进入过 apophis 论坛之前不显示任何结果，只给一行黑字
  if(key==='infuse' && !isUnlocked('apophis')){
    out.innerHTML =
      '<div class="empty"><div class="want" id="wantq"></div></div>';
    // 静默半秒后逐字浮现，像有什么东西自己写上去的
    setTimeout(function(){
      var w=document.getElementById('wantq');
      if(!w) return;
      w.classList.add('on');
      var s='你想看到什么？', i=0;
      (function step(){
        if(!document.getElementById('wantq')) return;
        if(i<s.length){ w.textContent+=s[i++]; setTimeout(step, 140); }
      })();
    }, 700);
    return;
  }
  // 规则：海鸥小组的帖子默认只在「精确搜毁神星」或「精确搜帖子完整标题」时出现；
  // 另按需求放开：搜「小行星 / 小行星撞地球 / 心源性猝死」以及不带问号的「这个世界怎么了」也出现
  var nQuery = norm(String(query).trim());
  var exactHit = (nQuery === norm(String(key).trim()));
  if(key === '2036年小行星撞地球' &&
     (nQuery==='小行星' || nQuery==='小行星撞地球')) exactHit = true;
  if(key === '猝死' && nQuery === '心源性猝死') exactHit = true;
  if(!(exactHit && (key === '毁神星' || key === '2036年小行星撞地球' || LIST_ALLOW_HAIOU_KEYS.indexOf(key) >= 0))){
    list = list.filter(function(r){ return !/haiou/.test(r.path); });
  }
  // 隐藏结果：需先解锁（如访问过 apophis 论坛）
  list = list.filter(function(r){ return !r.secret || isUnlocked(r.secret); });
  var html = '<div class="meta"><span>搜索结果</span></div><div class="results">';
  list.forEach(function(r){
    var inner =
      '<div class="src"><span class="ico" style="background:'+r.icon.bg+'">'+esc(r.icon.t)+'</span>'+
      '<span class="url"><span class="d">'+showURL(r)+'</span></span></div>'+
      '<h3><a>'+hl(r.title,key)+'</a>'+(r.ad?'<span class="adtag">广告</span>':'')+'</h3>'+
      '<div class="desc">'+(r.date?'<span class="date">'+esc(r.date)+' ·</span> ':'')+
      '<span class="dt">'+hl(r.desc,key)+'</span></div>';
    if(r.clickable){
      html += '<div class="res clickable" onclick="open1(\''+r.href+'\')">'+inner+'</div>';
    }else{
      html += '<div class="res" onclick="toast(\'该链接暂不可访问\')">'+inner+'</div>';
    }
  });
  html += '</div><div class="noMore">暂无更多搜索结果</div>';
  out.innerHTML = html;
}

/* ---------- 交互 ---------- */
function go(e){
  if(e) e.preventDefault();
  var v = el('q').value.trim();
  if(!v) v = el('q').placeholder;   // 空输入时直接搜占位词
  if(v) addHist(v);
  closeDrop();
  pushURL(v); render(v);
  el('q').blur();
  return false;
}
function pick(v){ el('q').value=v; go(); }
function pushURL(v){
  var sc = GETSC();
  var target = (v ? ('?q='+encodeURIComponent(v)) : '?') + (sc ? (v?'&':'')+'sharecode='+sc : '');
  try{
    history.pushState(null,'', target);
  }catch(e){
    location.hash = v ? ('#/search?q='+encodeURIComponent(v)) : '#/search';
  }
}
function GETSC(){
  var sc='';
  try{ sc=new URLSearchParams(location.search).get('sharecode')||''; }catch(e){}
  if(!sc){ var m=location.pathname.match(/\/s\/([A-Za-z0-9]+)/); if(m) sc=m[1]; }
  if(!sc){ try{ sc=sessionStorage.getItem('hl_sc')||''; }catch(e){} }
  if(!sc) sc=SHARECODE;
  return sc;
}
var LIVE_SITE='https://hailuo.app.workbuddy.host';
var SHARECODE='WL4E3TYTAS';
function open1(href){
  // 预览面板（代理在 workbuddy.cn 下）无法跨页跳转 → 新标签打开正式站点
  if(/(^|\.)workbuddy\.cn$/.test(location.hostname) || location.protocol==='about:'){
    var w = window.open(LIVE_SITE + href + '?sharecode=' + SHARECODE, '_blank');
    // 新标签被拦截/被封 → 当前页直接跳
    if(!w) location.href = LIVE_SITE + href + '?sharecode=' + SHARECODE;
    return;
  }
  var PAGE_EXISTS=['/tianwenguancha/news','/item/huishenxing','/item/apep','/haiou/group/xingqiu','/haiou/group/cusi','/xinzhi/news','/cike/article','/taosheng/news','/infuse/about','/news/ziwei-infuse'];
  function norm(u){ return String(u).replace(/\/+$/,''); }
  if(PAGE_EXISTS.indexOf(norm(href))>=0){
    if(location.protocol==='file:'){
      // 本地双击打开：绝对 file:// 路径（相对根路径在 file: 下会跑到盘符根目录）
      location.href='file://'+location.pathname.replace(/\/search\/index\.html.*$/,'')+norm(href)+'/index.html';
    } else {
      // 正式站必须带 sharecode，丢了这个参数会被网关拦成“链接不完整”页
      location.href='../'+norm(href).replace(/^\/+/,'')+'/?sharecode='+GETSC();
    }
  }
  else toast('该链接暂不可访问');
}
var tt;
function toast(msg){
  var t=el('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on')},1600);
}
function closeDrop(){ el('szone').classList.remove('open'); }

el('q').addEventListener('focus', function(){ if(getHist().length){ renderDrop(); el('szone').classList.add('open'); } });
el('q').addEventListener('input', function(){
  if(!el('q').value && getHist().length){ renderDrop(); el('szone').classList.add('open'); }
  else closeDrop();
});
document.addEventListener('click', function(e){
  if(!el('szone').contains(e.target)) closeDrop();
});
function isUnlocked(k){
  try{
    if(localStorage.getItem('hl_unlock_'+k)==='1') return true;
  }catch(e){}
  return false;
}
window.addEventListener('popstate', fromURL);

function fromURL(){
  var q = new URLSearchParams(location.search).get('q');
  if(q===null){
    var h = location.hash;
    if(h.indexOf('q=')>=0) q = new URLSearchParams(h.replace(/^#.*\?/,'')).get('q');
  }
  q = q || '';
  el('q').value = q;
  render(q);
}
