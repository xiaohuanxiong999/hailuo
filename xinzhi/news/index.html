  <div class="art">
    <p>2024年11月1日，省田径队一名年轻运动员凌晨在训练场加练后突然倒地，经现场急救并送医抢救无效死亡，初步判断为心源性猝死。</p>
    <p>教练表示，该运动员平时训练刻苦，近期训练强度明显增加；队友称其最近状态异常亢奋，凌晨仍自行加练。</p>
    <p>目前事件具体原委仍正在进一步调查中。队方表示将配合家属处理善后事宜。</p>
