  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#040404}
  body{color:#b8303a;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.9;
    background-image:radial-gradient(ellipse 80% 55% at 50% -10%, rgba(120,10,16,.22), transparent 70%),
                     repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    background-attachment:fixed}
  ::selection{background:#b8303a;color:#000}

  .scan{position:fixed;inset:0;pointer-events:none;z-index:9;
    background:linear-gradient(to bottom, transparent 0%, rgba(180,20,30,.045) 50%, transparent 100%);
    animation:scanmove 7s linear infinite}
  @keyframes scanmove{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}

  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;position:relative;z-index:2;text-align:center}
  .sigil{width:64px;height:64px;margin-bottom:22px}
  .brand{font-family:'ApoSerif','Songti SC',serif;font-size:52px;font-weight:700;
    letter-spacing:14px;color:#d81f2b;margin:0;text-indent:14px;line-height:1.25;
    text-shadow:0 0 10px rgba(255,40,52,.9), 0 0 26px rgba(216,31,43,.75), 0 0 70px rgba(180,20,30,.6), 0 0 120px rgba(140,10,18,.55)}
  .rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px 0 14px}
  .rule i{display:block;height:1px;width:72px;background:linear-gradient(90deg,transparent,#5e1015)}
  .rule i:last-child{background:linear-gradient(90deg,#5e1015,transparent)}
  .rule b{width:5px;height:5px;background:#8e161c;transform:rotate(45deg)}
  .slogan{font-size:13px;letter-spacing:9px;color:#7d1419;text-indent:9px}

  .headbtns{display:flex;justify-content:center;gap:14px;margin-top:38px}
  .btn{border:1px solid #551013;color:#a0242c;background:transparent;border-radius:1px;
    padding:8px 34px;font-size:13px;letter-spacing:4px;cursor:pointer;font-family:inherit;
    text-indent:4px;transition:.2s;
    box-shadow:0 0 10px rgba(180,20,30,.35), inset 0 0 8px rgba(120,10,16,.25)}
  .btn:hover{box-shadow:0 0 16px rgba(216,31,43,.55), inset 0 0 10px rgba(120,10,16,.35);
    background:rgba(120,14,20,.18);border-color:#8e161c;color:#d81f2b}

  .toast{position:fixed;left:50%;bottom:60px;transform:translate(-50%,10px);
    background:#150404;color:#c0656d;font-size:13px;padding:9px 16px;border-radius:3px;
    border:1px solid #3a0f10;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:560px){
    .brand{font-size:36px;letter-spacing:9px;text-indent:9px}
    .slogan{letter-spacing:6px;font-size:11.5px}
    .sigil{width:52px;height:52px;margin-bottom:16px}
  }
</style>
</head>
<body>
<div class="scan"></div>
<div class="gate">
  <div class="sigil"></div>
  <h1 class="brand">APOPHIS</h1>
  <div class="rule"><i></i><b></b><i></i></div>
  <div class="slogan">混沌带来新生</div>
  <div class="headbtns">
    <button class="btn" id="btnPost">留 言</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
/* 进入本页即解锁「猝死」搜索中的药企新闻 */
try{
  localStorage.setItem('hl_unlock_apophis','1');
}catch(e){}
function tip(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(tip._t);
  tip._t=setTimeout(function(){ t.classList.remove('on'); },1600);
}
function gotoBoard(){
  if(location.protocol==='file:'){ location.href='board/index.html'; return; }
  var sc='';
  try{ sc=new URLSearchParams(location.search).get('sharecode')||''; }catch(e){}
  location.href='board/'+('?sharecode='+(sc||'WL4E3TYTAS'));
}
document.getElementById('btnPost').addEventListener('click', gotoBoard);
</script>
</body>
