<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - Infuse生物医药</title>
<style>
  .brandmark{height:30px;vertical-align:-5px;margin-top:-5px;margin-right:8px;display:inline-block}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:#e8e0f2;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#12081f;line-height:1.85}
  ::selection{background:#8a4fd8;color:#fff}

  /* 星空背景 */
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 90% 60% at 70% -10%, rgba(150,60,200,.28), transparent 60%),
      radial-gradient(ellipse 70% 50% at 15% 30%, rgba(230,90,180,.14), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 110%, rgba(90,40,160,.25), transparent 65%),
      linear-gradient(180deg,#170a2b 0%,#12081f 45%,#0d0618 100%)}
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;
    animation:tw 3s ease-in-out infinite}
  .stars i:nth-child(3n){width:1px;height:1px;opacity:.45}
  .stars i:nth-child(4n){width:2.5px;height:2.5px;opacity:.9;box-shadow:0 0 6px rgba(255,220,255,.8)}
  .stars i:nth-child(5n){animation-duration:5s}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
  .wrap{position:relative;z-index:1}

  /* 顶部工具条 */
  .utilbar{background:rgba(10,5,20,.75);border-bottom:1px solid rgba(180,120,240,.15)}
  .utilbar .in{max-width:1080px;margin:0 auto;padding:8px 22px;display:flex;justify-content:flex-end;gap:26px}
  .utilbar a{color:#a08cc4;font-size:12px;cursor:pointer;text-decoration:none}
  .utilbar a:hover{color:#d8c8f0}

  /* 主导航 */
  .navbar{background:rgba(14,7,26,.85);border-bottom:1px solid rgba(180,120,240,.18);
    position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
  .navbar .in{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:34px}
  .logo{font-size:24px;font-weight:800;letter-spacing:.5px;cursor:pointer;user-select:none;
    background:linear-gradient(90deg,#e58ee8,#a86ef5 60%,#7ec8f5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(190,110,240,.45))}
  .mainnav{margin-left:auto;display:flex;gap:28px}
  .mainnav a{color:#cbb8ea;font-size:14px;cursor:pointer;text-decoration:none;padding:4px 0;
    border-bottom:2px solid transparent}
  .mainnav a:hover{color:#fff;text-shadow:0 0 8px rgba(220,150,255,.6)}
  .mainnav a.act{color:#f0a0e8;border-bottom-color:#f0a0e8}

  /* Hero：实底面板（参照绿色版的深色块 + 大圆弧纹理） */
  .hero{max-width:1080px;margin:0 auto;padding:84px 22px 76px;position:relative;overflow:hidden;
    background:
      radial-gradient(circle 620px at 78% 30%, rgba(150,70,210,.16), transparent 70%),
      radial-gradient(circle 900px at 50% 120%, rgba(230,90,180,.10), transparent 70%),
      linear-gradient(160deg,#221038 0%,#1a0c2e 55%,#150925 100%);
    border-bottom:1px solid rgba(180,120,240,.15)}
  .hero::before{content:'';position:absolute;right:-160px;top:50%;transform:translateY(-50%);
    width:620px;height:620px;border-radius:50%;
    border:1px solid rgba(200,140,250,.12);pointer-events:none}
  .hero::after{content:'';position:absolute;right:-80px;top:50%;transform:translateY(-50%);
    width:460px;height:460px;border-radius:50%;
    border:1px solid rgba(200,140,250,.08);pointer-events:none}
  .hero>*{position:relative;z-index:1}
  .badge{display:inline-block;border:1px solid rgba(200,140,250,.5);color:#d8b8f5;
    padding:4px 14px;font-size:12px;letter-spacing:5px;text-indent:5px;margin-bottom:30px}
  .hero h1{margin:0 0 24px;font-size:46px;font-weight:800;line-height:1.3;letter-spacing:1px;
    background:linear-gradient(100deg,#ffd9f4,#d0a8ff 45%,#9fd4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(190,110,240,.3))}
  .hero .intro{max-width:640px;color:#cfc0e8;font-size:15.5px;margin:0 0 40px}
  .navbtns{display:flex;gap:14px;flex-wrap:wrap}
  .nbtn{border:1px solid rgba(200,140,250,.45);background:rgba(120,60,190,.14);color:#e6d6fb;
    border-radius:22px;padding:9px 26px;font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit;
    transition:.25s}
  .nbtn:hover{background:rgba(150,80,220,.3);border-color:rgba(220,160,255,.8);
    box-shadow:0 0 16px rgba(190,110,240,.45);color:#fff}

  /* 通用分节 */
  .sec{max-width:1080px;margin:0 auto;padding:56px 22px}
  .sec .eyebrow{color:#b48ae0;font-size:12px;letter-spacing:6px;text-indent:6px;margin:0 0 10px}
  .sec h2{margin:0 0 34px;font-size:30px;font-weight:800;color:#f4ecff}

  /* 价值观四卡 */
  .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    border:1px solid rgba(180,120,240,.2);background:rgba(90,40,150,.08)}
  .val{padding:30px 24px;border-right:1px solid rgba(180,120,240,.2)}
  .val:last-child{border-right:none}
  .val b{display:block;font-size:13px;color:#b48ae0;letter-spacing:3px;margin-bottom:14px;font-weight:600}
  .val span{font-size:17px;font-weight:700;color:#f0e6ff;letter-spacing:2px}

  /* 药品安全 */
  .safe .txt{max-width:760px;color:#cfc0e8;font-size:15px}
  .safe .txt p{margin:0 0 14px}

  /* 联系我们 */
  .contact .inner{max-width:640px;margin:0 auto;padding:56px 22px}
  .contact h2{margin:0 0 10px;font-size:30px;font-weight:800;color:#f4ecff}
  .contact .lead{color:#bca8e0;font-size:14px;margin:0 0 30px}
  .fld{margin-bottom:18px}
  .fld label{display:block;font-size:13px;color:#bca8e0;letter-spacing:1px;margin-bottom:7px}
  .fld input,.fld textarea{width:100%;border:1px solid rgba(170,110,230,.35);border-radius:8px;
    background:rgba(20,10,40,.6);color:#f0e8fc;font-size:14px;padding:12px 14px;font-family:inherit;
    outline:none;transition:border-color .2s, box-shadow .2s}
  .fld input:focus,.fld textarea:focus{border-color:rgba(210,150,255,.7);box-shadow:0 0 12px rgba(190,110,240,.3)}
  .fld textarea{min-height:150px;resize:vertical}
  .submit{border:none;border-radius:8px;padding:12px 42px;font-size:15px;letter-spacing:4px;text-indent:4px;
    cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(95deg,#b05ce8,#7a5cf0);transition:.25s}
  .submit:hover{box-shadow:0 0 18px rgba(170,100,240,.6)}

  /* 扭曲黑幕（留言框触发） */
  .veil{position:absolute;inset:0;border-radius:8px;display:none;z-index:5;
    background:#05030a;color:#c9b8ee;padding:16px 20px 16px 16px;font-size:14px;line-height:2.05;
    border:1px solid rgba(180,120,240,.4);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(180,120,240,.32) transparent}
  .veil.on{display:block}
  /* 问句：静止，取 Infuse 标志的紫粉渐变 */
  .veil .g{display:inline-block;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#e58ee8,#a86ef5 60%,#7ec8f5);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(190,110,240,.5))}
  /* 黑幕滚动条：紫色，淡 */
  .veil::-webkit-scrollbar{width:6px}
  .veil::-webkit-scrollbar-track{background:transparent}
  .veil::-webkit-scrollbar-thumb{background:rgba(180,120,240,.3);border-radius:3px}
  .veil::-webkit-scrollbar-thumb:hover{background:rgba(200,140,255,.55)}
  /* 页面滚动条：改颜色，保留可拖拽 */
  html{scrollbar-color:rgba(150,80,220,.5) rgba(20,10,40,.5);scrollbar-width:thin}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:rgba(20,10,40,.55)}
  ::-webkit-scrollbar-thumb{background:rgba(150,80,220,.5);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(180,110,240,.7)}
  .cbox ::-webkit-scrollbar{width:6px}

  .toast{position:fixed;left:50%;bottom:56px;transform:translate(-50%,10px);
    background:#241338;color:#d8c6f2;font-size:13px;padding:9px 16px;border-radius:6px;
    border:1px solid rgba(180,120,240,.4);opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* 底栏 */
  .foot{border-top:1px solid rgba(180,120,240,.18);margin-top:40px}
  .foot .in{max-width:1080px;margin:0 auto;padding:22px;display:flex;align-items:center;justify-content:space-between}
  .foot .fl{font-size:20px;font-weight:800;
    background:linear-gradient(90deg,#e58ee8,#a86ef5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot .fr{font-size:11.5px;color:#8f7ab0;letter-spacing:1px}

  @media (max-width:640px){
    .hero{padding:60px 22px 52px}
    .hero h1{font-size:30px}
    .mainnav{gap:16px}
    .mainnav a{font-size:12.5px}
    .navbar .in{gap:16px}
    .vals{grid-template-columns:repeat(2,1fr)}
    .val:nth-child(2){border-right:none}
    .val:nth-child(1),.val:nth-child(2){border-bottom:1px solid rgba(180,120,240,.2)}
  }
</style>
<style>
  /* contact 专属微调 */
  .contact{max-width:1080px;margin:0 auto;padding:56px 22px 20px}
  .contact h2{margin:0 0 10px;font-size:30px;font-weight:800;color:#f4ecff}
  .contact .lead{color:#bca8e0;font-size:14px;margin:0 0 30px}
  .cbox{max-width:640px}
</style>
</head>

<div class="toast" id="toast"></div>
<script>
/* 星空 */
(function(){
  var box=document.getElementById('stars'), s='';
  for(var i=0;i<110;i++){
    s+='<i style="left:'+(Math.random()*100).toFixed(2)+'%;top:'+(Math.random()*100).toFixed(2)+'%;animation-delay:'+(Math.random()*4).toFixed(2)+'s"></i>';
  }
  box.innerHTML=s;
})();
var tipHeld=false;
function tip(msg){
  if(tipHeld) return;
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(tip._t);
  tip._t=setTimeout(function(){ t.classList.remove('on'); },1600);
}
document.querySelectorAll('[data-deny]').forEach(function(a){
  a.addEventListener('click', function(){ tip('您无权访问该页面'); });
});
function gotoAbout(){
  if(location.protocol==='file:'){ location.href='../about/index.html'; return; }
  var sc='';
  try{ sc=new URLSearchParams(location.search).get('sharecode')||''; }catch(e){}
  location.href='/infuse/about/'+('?sharecode='+(sc||'WL4E3TYTAS'));
}

/* 提交逻辑统一在下方（留言内容即答案），此处不再预先弹提示 */

/* 留言框：只有空白时黑幕才浮现（悬停或聚焦）；一打字就隐藏，移开鼠标再显示 */
var veil=document.getElementById('veil'),
    msgEl=document.getElementById('msg'),
    veilTimer=null,
    veilShown=false;
function isTyping(){ return (msgEl.value||'').length>0; }
function showVeil(){
  if(veilShown || isTyping()) return;
  var html =
    '<p>如果你已经找到了这里，大概一切都已经无法挽回了。纵使最终还是走到了这一步，以他的谨慎也不会把我们的任何把柄泄露给公众的。但我还是希望至少留下这段话，让找到这里的你知道infuse身上发生了什么，他又做了什么——无论这个选择会给我们带来怎样的后果。</p>'+
    '<p>我造成的后果已经足够多了。</p>'+
    '<p>但在此之前，为了确认你是对的人，我想问一个问题：<span class="g" data-t="钥匙是什么？">钥匙是什么？</span></p>'+
    '<p style="color:#7a6298;font-size:12.5px">（在留言内容中写下你的回答，然后提交。）</p>';
  veil.innerHTML=html;
  veil.classList.add('on');
  veil.scrollTop=0;
  veilShown=true;
}
function hideVeil(){
  if(!veilShown) return;
  veil.classList.remove('on');
  veilShown=false;
}
var msgFld=msgEl.closest('.fld');
/* 黑幕盖在留言框上，所以整个 fld 区域都用坐标判断“鼠标还在不在” */
function ptsInFld(x,y){
  var r=msgFld.getBoundingClientRect();
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}
msgFld.addEventListener('mouseenter', function(){ clearTimeout(veilTimer); showVeil(); });
msgFld.addEventListener('mouseleave', function(e){
  if(ptsInFld(e.clientX, e.clientY)) return;
  hideVeil();
});
document.addEventListener('mousemove', function(e){
  var inside = ptsInFld(e.clientX, e.clientY) || e.target===msgEl;
  if(inside) showVeil(); else hideVeil();
});
/* 黑幕不挡输入：点击即聚焦留言框；滚轮交给黑幕自身滚动（它的滚动条被隐藏了） */
veil.addEventListener('click', function(){ msgEl.focus(); });
veil.addEventListener('wheel', function(e){
  var maxS = veil.scrollHeight - veil.clientHeight;
  if(maxS<=0) return;                       // 内容没溢出 → 允许页面滚
  var atTop = veil.scrollTop<=0, atBot = veil.scrollTop>=maxS-1;
  if((e.deltaY<0 && atTop) || (e.deltaY>0 && atBot)) return;
  veil.scrollTop += e.deltaY;
  e.preventDefault();
}, {passive:false});
/* 一有内容就收起黑幕，避免“盲打”；清空后若鼠标还在框内则重新浮现 */
function syncVeil(){
  if(isTyping()) hideVeil();
  else {
    var r=msgFld.getBoundingClientRect();
    if(lastX>=r.left && lastX<=r.right && lastY>=r.top && lastY<=r.bottom) showVeil();
  }
}
var lastX=-1,lastY=-1;
document.addEventListener('mousemove', function(e){ lastX=e.clientX; lastY=e.clientY; });
msgEl.addEventListener('focus', function(){ clearTimeout(veilTimer); showVeil(); });
msgEl.addEventListener('input', syncVeil);
msgEl.addEventListener('change', syncVeil);

/* 提交：留言内容即答案 */
document.getElementById('btnSend').addEventListener('click', function(){
  var v=(msgEl.value||'').trim().toLowerCase().replace(/[“”\"'。.，,\s]+$/,'').replace(/^[“”\"']+/,'');
  if(v==='revelation'){
    tipHeld=true;                       // 正确密钥：不弹任何提示，直接进文档
    hideVeil();
    if(location.protocol==='file:'){ location.href='../../truth/one/index.html'; return; }
    var sc='';
    try{ sc=new URLSearchParams(location.search).get('sharecode')||''; }catch(e){}
    location.href='/truth/one/'+('?sharecode='+(sc||'WL4E3TYTAS'));
  }else{
    tip('发送失败，请稍后重试');
  }
});
/* 姓名/联系方式：无需输入 */
document.querySelectorAll('.cbox .fld input').forEach(function(inp){
  inp.addEventListener('click', function(){ this.blur(); tip('您无需输入'); });
  inp.addEventListener('focus', function(){ this.blur(); tip('您无需输入'); });
});
</script>
