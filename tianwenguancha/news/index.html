  .veil{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(11,16,32,.55),rgba(11,16,32,.88))}
  .page{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:40px 22px 60px}



  h1{
    margin:14px 0 10px;font-size:26px;font-weight:600;line-height:1.5;
    letter-spacing:.01em;
  }
  .meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
  .meta .src{color:var(--blue)}

  /* 配图 */
  figure{margin:26px 0 0}
  figure img{
    display:block;border-radius:8px;
    max-width:min(420px,86%);max-height:60vh;object-fit:cover;
    margin:0 auto;
    box-shadow:0 14px 40px -18px rgba(0,0,0,.8);
  }
  figcaption{margin-top:8px;font-size:12px;color:var(--ink-3);text-align:center;letter-spacing:.05em}

  article p{margin:1.4em 0;color:var(--ink-2);text-indent:2em}

  <article>
    <p class="first">2036年，地球有可能会被小行星撞上？这还要从一颗著名的小行星——<b>毁神星</b>开始说起。</p>
    <p><b>毁神星</b>是一颗大型近地小行星，直径约为370米，如果撞击地球将会引发如同15.3亿吨TNT炸药爆炸释出的能量。</p>
    <p><b>毁神星</b>在2004年首次被发现时，人们发现它有可能撞上地球，引发了大范围的担忧情绪。这颗小行星将在2029年、2036年和2068年接近地球。</p>
