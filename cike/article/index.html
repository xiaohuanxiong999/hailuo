  <h1>知名商贸公司销售员工连续加班后猝死，劳动监察部门介入</h1>
  <div class="meta"><div class="av">此</div><span>此刻网 · 本地资讯</span><span>2024-11-15 22:40</span><div class="follow">关注</div></div>
  <div class="art">
    <p>11月15日晚，本市知名商贸公司销售部一名员工于工位倒地，送医抢救无效死亡，引发广泛社会关注。</p>
    <p>部门主管向记者介绍，该员工近期常主动申请夜间加班，并拒绝主管劝其休息，公司目前正在积极配合相关部门调查，网传其“使用某类提神补剂”的说法暂未被证实。</p>
    <p>劳动监察部门已就该公司用工及加班情况展开核查。</p>
  </div>
</div>
